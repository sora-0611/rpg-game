<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定画面</title>
    <link rel="stylesheet" href="settings.css">
</head>

<body>
    <audio id="bgm-audio" src="./js/甘茶の音楽工房_フィヨルドの澄んだ風.mp3" loop></audio><!--仮のBGMファイルです 全画面で同じBGMを流します-->

    <div class="settings-container">
        <h1 class="settings-title">設定画面</h1>

        <form class="settings-form">
            <!-- BGM音量 -->
            <div class="settings-group">
                <label for="bgm-volume" class="settings-label">BGM音量</label>
                <div class="slider-wrapper">
                    <span class="slider-value-min">0</span>
                    <div class="slider-container">
                        <input type="range" id="bgm-volume" name="bgm-volume" min="0" max="100" value="100"
                            class="slider">
                        <div class="slider-track">
                            <div class="slider-fill"></div>
                        </div>
                    </div>
                    <span class="slider-current">100</span>
                    <button type="button" class="mute-button mute-icon" aria-label="BGM音量をミュート">🔇</button>
                </div>
            </div>

            <!-- フルスクリーン（パネル） -->
            <div class="panel">
                <div class="panel-row">
                    <div class="panel-left">
                        <span class="panel-icon">⤢</span>
                        <label for="fullscreen" class="settings-label">フルスクリーン</label>
                    </div>
                    <div class="panel-right">
                        <div class="toggle-switch">
                            <input type="checkbox" id="fullscreen" name="fullscreen" class="toggle-checkbox">
                            <label for="fullscreen" class="toggle-label"></label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 戻るボタン -->
            <button type="button" class="back-button">戻る</button>
        </form>
    </div>

    <script src="./js/settingsStore.js"></script>
    <script src="settings.js"></script>
</body>

</html>
